<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atelier | Account Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f8f4;
            color: #191919;
            font-family: "Source Sans 3", sans-serif;
            font-size: 14px;
        }

        .settings-container {
            max-width: 850px;
            margin: auto;
            padding: 40px 20px 100px;
        }

        .page-title {
            font-family: "Playfair Display", serif;
            font-size: 54px;
            font-weight: 400;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
        }

        .page-description {
            color: #858585;
            font-size: 15px;
            margin-bottom: 60px;
        }

        .settings-section {
            border-top: 1px solid #e6e5df;
            padding-top: 36px;
            margin-bottom: 40px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.6px;
            margin-bottom: 17px;
            color: #454545;
        }

        .section-title {
            font-family: "Playfair Display", serif;
            font-size: 27px;
            font-weight: 400;
            margin-bottom: 21px;
        }

        .settings-card {
            background: #fff;
            border: 1px solid #e8e8e5;
            padding: 31px;
        }

        .profile-picture-section {
            display: flex;
            align-items: center;
            gap: 23px;
            padding-bottom: 29px;
            border-bottom: 1px solid #e8e8e5;
            margin-bottom: 12px;
        }

        .profile-picture {
            width: 98px;
            height: 98px;
            border-radius: 50%;
            background: #eeede6;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            font-size: 26px;
            color: #555;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-heading {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .upload-description {
            color: #858585;
            font-size: 14px;
            margin-bottom: 11px;
        }

        .upload-button {
            border: 1px solid #333;
            background: white;
            color: #222;
            padding: 8px 15px;
            font-size: 13px;
            transition: 0.2s;
        }

        .upload-button:hover {
            background: #191919;
            color: white;
        }

        .profile-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #eeeeeb;
            background: transparent;
            outline: none;
            padding: 14px 0;
            color: #333;
            font-family: "Source Sans 3", sans-serif;
            font-size: 14px;
        }

        .profile-input:focus {
            border-bottom-color: #191919;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 11px;
        }

        .password-field {
            position: relative;
            margin-bottom: 19px;
        }

        .password-input {
            width: 100%;
            height: 46px;
            background: #f9f9f6;
            border: 1px solid #deded9;
            padding: 10px 65px 10px 13px;
            outline: none;
            color: #333;
            font-family: "Source Sans 3", sans-serif;
            font-size: 14px;
            border-radius: 0;
        }

        .password-input:focus {
            border-color: #777;
            box-shadow: none;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #555;
            font-family: "Source Sans 3", sans-serif;
            font-size: 11px;
            cursor: pointer;
        }

        .main-button {
            width: 100%;
            min-height: 49px;
            background: #171717;
            color: white;
            border: 1px solid #171717;
            padding: 13px 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            font-family: "Source Sans 3", sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

        .main-button:hover {
            background: #333;
            color: white;
        }

        .button-arrow {
            font-size: 21px;
            font-weight: 400;
            line-height: 1;
        }

        .account-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logout-button,
        .delete-button {
            padding: 11px 21px;
            font-size: 13px;
            transition: 0.2s;
        }

        .logout-button {
            background: #191919;
            border: 1px solid #191919;
            color: white;
        }

        .logout-button:hover {
            background: #333;
            color: white;
        }

        .delete-button {
            background: transparent;
            border: 1px solid #d68c8c;
            color: #b76565;
        }

        .delete-button:hover {
            background: #b76565;
            color: white;
        }

        .status-message {
            font-size: 13px;
            margin-top: 14px;
            margin-bottom: 0;
        }

        .site-footer {
            background: #171717;
            color: #888;
            padding: 75px 4.5% 17px;
        }

        .footer-line {
            border-top: 1px solid #292929;
            padding-top: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            font-size: 11px;
        }

        .footer-links {
            display: flex;
            gap: 27px;
        }

        .footer-links a {
            text-decoration: none;
            color: #888;
        }

        .footer-links a:hover {
            color: white;
        }

        @media (max-width: 900px) {
            .page-title {
                font-size: 45px;
            }
        }

        @media (max-width: 576px) {
            .settings-container {
                padding: 25px 4% 80px;
            }

            .page-title {
                font-size: 36px;
                letter-spacing: -0.8px;
            }

            .page-description {
                margin-bottom: 40px;
            }

            .section-title {
                font-size: 24px;
            }

            .settings-card {
                padding: 20px;
            }

            .profile-picture-section {
                align-items: flex-start;
                gap: 15px;
            }

            .profile-picture {
                width: 75px;
                height: 75px;
            }

            .account-actions {
                align-items: flex-start;
            }

            .footer-line {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }

            .site-footer {
                padding-top: 45px;
            }
        }
    </style>
</head>

<body>

    <main class="settings-container">

        <header>
            <h1 class="page-title">Account settings.</h1>
            <p class="page-description">
                Manage your profile and account security.
            </p>
        </header>

        <section class="settings-section">
            <p class="section-label">PROFILE</p>
            <h2 class="section-title">Your information</h2>

            <div class="settings-card">

                <div class="profile-picture-section">
                    <div class="profile-picture" id="profilePicture">
                        <span id="plusIcon">+</span>
                    </div>

                    <div>
                        <h3 class="upload-heading">Profile picture</h3>

                        <p class="upload-description">
                            Upload an image to personalize your account.
                        </p>

                        <input type="file" id="imageUpload" accept="image/*" class="d-none">

                        <button type="button" class="upload-button"
                            onclick="document.getElementById('imageUpload').click()">
                            Upload image
                        </button>
                    </div>
                </div>

                <form id="profileForm">
                    <div>
                        <label for="profileName" class="visually-hidden">Name</label>
                        <input type="text" class="profile-input" id="profileName" placeholder="Name" required>
                    </div>

                    <div>
                        <label for="profileEmail" class="visually-hidden">Email</label>
                        <input type="email" class="profile-input" id="profileEmail" placeholder="Email" required>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="main-button">
                            <span>Save changes</span>
                            <span class="button-arrow">&rarr;</span>
                        </button>
                    </div>

                    <p id="profileMessage" class="status-message" role="status"></p>
                </form>
            </div>
        </section>

        <section class="settings-section">
            <p class="section-label">SECURITY</p>
            <h2 class="section-title">Change password</h2>

            <div class="settings-card">
                <form id="passwordForm">

                    <div class="password-field">
                        <label for="currentPassword" class="field-label">
                            Current password
                        </label>

                        <input type="password" id="currentPassword" class="password-input"
                            placeholder="Current password" autocomplete="current-password" required>

                        <button type="button" class="show-password  " style="margin-top: 15px;"
                            onclick="togglePassword('currentPassword', this)">
                            Show
                        </button>
                    </div>

                    <div class="password-field">
                        <label for="newPassword" class="field-label">
                            New password
                        </label>

                        <input type="password" id="newPassword" class="password-input" placeholder="New password"
                            autocomplete="new-password" required>

                        <button type="button" class="show-password " style="margin-top: 15px;"
                            onclick="togglePassword('currentPassword', this)">
                            Show
                        </button>
                    </div>

                    <div class="password-field">
                        <label for="confirmPassword" class="field-label">
                            Confirm new password
                        </label>

                        <input type="password" id="confirmPassword" class="password-input"
                            placeholder="Confirm new password" autocomplete="new-password" required>

                        <button type="button" class="show-password " style="margin-top: 15px;"
                            onclick="togglePassword('currentPassword', this)">
                            Show
                        </button>
                    </div>

                    <button type="submit" class="main-button mt-3">
                        <span>Change password</span>
                        <span class="button-arrow">&rarr;</span>
                    </button>

                    <p id="passwordMessage" class="status-message" role="status"></p>
                </form>
            </div>
        </section>

        <section class="settings-section mb-0">
            <p class="section-label">ACCOUNT</p>
            <h2 class="section-title">Account actions</h2>

            <div class="account-actions">
                <button type="button" class="logout-button" id="logoutButton">
                    Logout
                </button>

                <button type="button" class="delete-button" id="deleteButton">
                    Delete account
                </button>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="footer-line">
            <p class="mb-0">
                &copy; 2026 Atelier. All rights reserved.
            </p>

            <div class="footer-links">
                <a href="#" onclick="return false;">Privacy</a>
                <a href="#" onclick="return false;">Terms</a>
            </div>
        </div>
    </footer>

    <script src="account.js"></script>

</body>

</html>
