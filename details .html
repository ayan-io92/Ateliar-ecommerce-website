<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Atelier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f8f5;
            font-family: Arial, sans-serif;
            color: #191919;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 30px;
            color: #191919;
            text-decoration: none;
        }

        .product-image {
            width: 100%;
            height: 450px;
            object-fit: contain;
            padding: 25px;
            background: white;
        }

        .product-title {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .product-price {
            font-size: 27px;
            margin: 20px 0;
        }

        .back-button {
            display: inline-block;
            background: #191919;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
        }

        .back-button:hover {
            background: #444;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar bg-white py-3">
        <div class="container">
            <a href="home.html" class="logo">Atelier</a>
            <a href="products.html" class="text-dark">All Products</a>
        </div>
    </nav>

    <section class="container py-5">
        <div id="productDetails" class="text-center py-5">
            <div class="spinner-border"></div>
            <p>Loading product details...</p>
        </div>
    </section>

    <script>
        const productDetails = document.getElementById("productDetails");
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");

        async function getProductDetails() {
            if (!productId) {
                productDetails.innerHTML = `
                    <h3>Product not selected</h3>
                    <a href="products.html" class="back-button">Back to Products</a>
                `;
                return;
            }

            try {
                const response = await fetch(
                    "https://fakestoreapi.com/products/" + encodeURIComponent(productId)
                );

                if (!response.ok) {
                    throw new Error("Product not found");
                }

                const product = await response.json();

                if (!product || !product.id) {
                    throw new Error("Product not found");
                }

                productDetails.className = "row align-items-center g-5 text-start";

                productDetails.innerHTML = `
                    <div class="col-md-6">
                        <img src="${product.image}" alt="Product image" class="product-image">
                    </div>

                    <div class="col-md-6">
                        <p class="text-muted text-capitalize">${product.category}</p>
                        <h1 class="product-title"></h1>
                        <h2 class="product-price">$${Number(product.price).toFixed(2)}</h2>
                        <p id="productDescription"></p>
                        <a href="products.html" class="back-button">BACK TO PRODUCTS</a>
                    </div>
                `;

                productDetails.querySelector(".product-title").textContent = product.title;
                document.getElementById("productDescription").textContent = product.description;

            } catch (error) {
                productDetails.className = "text-center py-5";
                productDetails.innerHTML = `
                    <h3>Unable to load product</h3>
                    <p>Please check your internet connection and try again.</p>
                    <a href="products.html" class="back-button">Back to Products</a>
                `;
            }
        }

        getProductDetails();
    </script>

</body>

</html>
